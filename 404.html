<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP igual em todas as páginas. Ao mudar um script ou style inline, atualizar o hash (npm test indica o valor). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-UuVM8p71BA9Kre17rHIaD76AwMLpbaKZAKGHR6FE+7Q='; style-src 'self' 'sha256-HqDtAA8wr8+J/JUcXodcUhW/EESbhXfztJKtn5ge9GM=' 'sha256-XsSZxe6rB4MU4+xA5a2U37n7aKCHgb+SAC0ivrB5+w4=' 'sha256-ye3fPO5XKg75LzBJV/no4GfmoebCxgmd7D+JdbBt1ww='; font-src 'self'; img-src 'self'; media-src 'self'; connect-src 'self'; frame-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script>
      /* GitHub Pages: assets must resolve from site root on nested 404 URLs */
      (function () {
        var base = document.createElement("base");
        base.href = /\/cafe-avenida(\/|$)/.test(location.pathname) ? "/cafe-avenida/" : "/";
        document.head.prepend(base);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#DAD2C6" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada — Café Avenida</title>
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="images/icone-180.png" />
    <link rel="stylesheet" href="css/fontes.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/erro.css" />
  </head>
  <body data-page="error" class="erro-page">
    <main class="erro">
      <p class="erro__codigo" aria-hidden="true">404</p>

      <div class="erro__cartao">
        <a class="erro__marca" href="./" data-href-home data-i18n-attr="aria-label:error.home">
          <img class="erro__logo" data-logo src="images/logo-320.png" alt="Café Avenida" width="96" height="96" />
          <img
            class="erro__wordmark"
            src="images/web/logo-linha-600.webp"
            alt=""
            width="440"
            height="127"
            decoding="async"
          />
        </a>

        <p class="erro__eyebrow" data-i18n="error.eyebrow">Erro 404</p>
        <h1 class="erro__titulo" data-i18n="error.title">Esta página não está na ementa</h1>
        <p class="erro__texto" data-i18n="error.body">
          Pedimos desculpa — o endereço pode estar errado ou o link já não existir. Volte ao café e escolha por onde
          quer começar.
        </p>

        <div class="erro__acoes">
          <a class="btn btn--primary" href="./" data-href-home data-i18n="error.home">Voltar ao início</a>
          <a class="btn btn--secondary" href="ementa" data-href-ementa data-i18n="error.menu">Ver a ementa</a>
        </div>
      </div>
    </main>

    <script src="config.js"></script>
    <script src="js/branding.js"></script>
    <script src="i18n/pt.js"></script>
    <script src="i18n/en.js"></script>
    <script src="i18n/fr.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/erro.js"></script>
  </body>
</html>
